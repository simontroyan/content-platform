name: Run unit tests

on:
    pull_request:
        types: [opened, reopened, synchronize]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - run: python3 tests/test_api.py